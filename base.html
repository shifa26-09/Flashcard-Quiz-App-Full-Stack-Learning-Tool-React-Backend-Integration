<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FlashMind{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6C63FF;--secondary:#FF6584;--success:#43D9AD;--dark:#0f0f23;--card-bg:#1a1a2e;--surface:#16213e;--text:#e2e8f0;--muted:#94a3b8;--border:#2d3748}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
.navbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:1.5rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.navbar .logo{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.navbar a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .2s}
.navbar a:hover{color:var(--text)}
.container{max-width:1200px;margin:0 auto;padding:2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:10px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:.875rem;font-weight:600;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#5a52e0;transform:translateY(-1px);box-shadow:0 8px 25px rgba(108,99,255,.4)}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--primary)}
.btn-success{background:var(--success);color:#0f0f23}.btn-success:hover{background:#38c49a}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:2rem;width:90%;max-width:500px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{margin-bottom:1.5rem;font-size:1.2rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:.4rem;font-size:.85rem;color:var(--muted)}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.7rem 1rem;border-radius:10px;font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{min-height:100px;resize:vertical}
.modal-actions{display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--success);padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;transform:translateX(200%);transition:transform .3s;z-index:9999}
.toast.show{transform:translateX(0)}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <a href="/" class="logo">⚡ FlashMind</a>
  <a href="/">Decks</a>
</nav>
{% block content %}{% endblock %}
<div class="toast" id="toast"></div>
<script>
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.borderLeftColor=type==='success'?'#43D9AD':'#ef4444';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
