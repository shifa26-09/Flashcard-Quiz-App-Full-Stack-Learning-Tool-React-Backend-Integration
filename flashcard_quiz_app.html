<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcard Quiz App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }
  h1 { color: #fff; font-size: 2rem; margin-bottom: 8px; letter-spacing: 1px; }
  .subtitle { color: rgba(255,255,255,0.75); margin-bottom: 30px; font-size: 0.95rem; }

  /* Card */
  .card-container { perspective: 1000px; width: 100%; max-width: 520px; height: 280px; margin-bottom: 28px; }
  .card {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.4,2,.6,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .card-front { background: #fff; }
  .card-back  { background: #f0f4ff; transform: rotateY(180deg); }
  .card-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #aaa; margin-bottom: 12px; }
  .card-text  { font-size: 1.25rem; color: #333; line-height: 1.5; }
  .card-num   { position: absolute; top: 14px; right: 18px; font-size: 0.8rem; color: #bbb; }

  /* Buttons row */
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  button {
    border: none; border-radius: 10px; padding: 11px 24px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  button:active { transform: translateY(0); }
  .btn-nav   { background: rgba(255,255,255,0.2); color: #fff; }
  .btn-show  { background: #fff; color: #764ba2; }
  .btn-add   { background: #48bb78; color: #fff; }
  .btn-edit  { background: #ed8936; color: #fff; }
  .btn-del   { background: #fc5c65; color: #fff; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
  .overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 20px; padding: 32px; width: 90%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
  .modal h2 { margin-bottom: 20px; color: #333; }
  .modal label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 5px; margin-top: 14px; }
  .modal textarea {
    width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px 14px;
    font-size: 1rem; resize: vertical; min-height: 72px; font-family: inherit;
    transition: border-color .2s;
  }
  .modal textarea:focus { outline: none; border-color: #764ba2; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .btn-save   { background: #764ba2; color: #fff; }
  .btn-cancel { background: #e2e8f0; color: #555; }

  .no-cards { color: rgba(255,255,255,.8); font-size: 1.1rem; text-align: center; margin-top: 30px; }
  .progress { color: rgba(255,255,255,.7); font-size: 0.88rem; margin-bottom: 18px; }
</style>
</head>
<body>

<h1>📚 Flashcard Quiz</h1>
<p class="subtitle">Click a card to flip it!</p>

<div class="card-container" id="cardContainer">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front">
      <span class="card-label">Question</span>
      <p class="card-text" id="questionText">Loading...</p>
      <span class="card-num" id="cardNum"></span>
    </div>
    <div class="card-face card-back">
      <span class="card-label">Answer</span>
      <p class="card-text" id="answerText"></p>
    </div>
  </div>
</div>

<p class="progress" id="progress"></p>

<div class="btn-row">
  <button class="btn-nav" onclick="prevCard()">◀ Previous</button>
  <button class="btn-show" onclick="flipCard()">Show Answer</button>
  <button class="btn-nav" onclick="nextCard()">Next ▶</button>
</div>
<div class="btn-row">
  <button class="btn-add" onclick="openModal('add')">+ Add Card</button>
  <button class="btn-edit" onclick="openModal('edit')">✏️ Edit</button>
  <button class="btn-del" onclick="deleteCard()">🗑 Delete</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Flashcard</h2>
    <label>Question</label>
    <textarea id="inputQ" placeholder="Enter question..."></textarea>
    <label>Answer</label>
    <textarea id="inputA" placeholder="Enter answer..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<script>
let cards = [
  { q: "What is the capital of France?", a: "Paris" },
  { q: "What does HTML stand for?", a: "HyperText Markup Language" },
  { q: "What is 12 × 12?", a: "144" },
  { q: "Who wrote Romeo and Juliet?", a: "William Shakespeare" },
  { q: "What planet is known as the Red Planet?", a: "Mars" },
];
let current = 0;
let flipped = false;
let mode = 'add';

function render() {
  if (cards.length === 0) {
    document.getElementById('cardContainer').innerHTML = '<p class="no-cards">No flashcards yet. Add one!</p>';
    document.getElementById('progress').textContent = '';
    return;
  }
  const c = cards[current];
  document.getElementById('questionText').textContent = c.q;
  document.getElementById('answerText').textContent = c.a;
  document.getElementById('cardNum').textContent = `${current+1}/${cards.length}`;
  document.getElementById('progress').textContent = `Card ${current+1} of ${cards.length}`;
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  flipped = false;
}

function flipCard() {
  const card = document.getElementById('card');
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}
function nextCard() { if(cards.length===0)return; current=(current+1)%cards.length; render(); }
function prevCard() { if(cards.length===0)return; current=(current-1+cards.length)%cards.length; render(); }

function openModal(m) {
  mode = m;
  document.getElementById('modalTitle').textContent = m === 'add' ? 'Add Flashcard' : 'Edit Flashcard';
  if (m === 'edit' && cards.length > 0) {
    document.getElementById('inputQ').value = cards[current].q;
    document.getElementById('inputA').value = cards[current].a;
  } else {
    document.getElementById('inputQ').value = '';
    document.getElementById('inputA').value = '';
  }
  document.getElementById('overlay').classList.add('active');
}
function closeModal() { document.getElementById('overlay').classList.remove('active'); }
function saveCard() {
  const q = document.getElementById('inputQ').value.trim();
  const a = document.getElementById('inputA').value.trim();
  if (!q || !a) { alert('Please fill both fields.'); return; }
  if (mode === 'add') { cards.push({q,a}); current = cards.length - 1; }
  else { cards[current] = {q,a}; }
  closeModal(); render();
}
function deleteCard() {
  if (cards.length === 0) return;
  if (!confirm('Delete this flashcard?')) return;
  cards.splice(current, 1);
  if (current >= cards.length) current = Math.max(0, cards.length - 1);
  render();
}

document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
render();
</script>
</body>
</html>
